name: Compilar el mod

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar mis archivos
        uses: actions/checkout@v4

      - name: Instalar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Descargar el kit oficial de Forge 1.21.1
        run: |
          curl -fsSL https://files.minecraftforge.net/net/minecraftforge/forge/promotions_slim.json -o promos.json
          VER=$(jq -r '.promos["1.21.1-recommended"] // .promos["1.21.1-latest"]' promos.json)
          echo "Version de Forge: $VER"
          curl -fsSL -o mdk.zip "https://maven.minecraftforge.net/net/minecraftforge/forge/1.21.1-$VER/forge-1.21.1-$VER-mdk.zip"
          mkdir build-mod
          unzip -q mdk.zip -d build-mod
          ls -la build-mod

      - name: Poner el codigo del mod
        run: |
          rm -rf build-mod/src/main/java
          mkdir -p build-mod/src/main/java
          cp -r src/main/java/* build-mod/src/main/java/
          if [ -d src/main/resources ]; then cp -r src/main/resources/* build-mod/src/main/resources/; fi
          sed -i -E 's/^mod_id[[:space:]]*=.*/mod_id=rpgmod/' build-mod/gradle.properties
          grep -rl "examplemod" build-mod --include=*.properties --include=*.gradle --include=*.toml --include=*.json --include=*.mcmeta | xargs -r sed -i 's/examplemod/rpgmod/g'
          echo "--- gradle.properties ---"
          cat build-mod/gradle.properties
          echo "--- mods.toml ---"
          cat build-mod/src/main/resources/META-INF/mods.toml || true

      - name: Compilar
        working-directory: build-mod
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Revisar el mod terminado
        run: |
          ls -la build-mod/build/libs
          for j in build-mod/build/libs/*.jar; do echo "== $j"; unzip -p "$j" META-INF/mods.toml | head -30 || true; done

      - name: Guardar el archivo del mod
        uses: actions/upload-artifact@v4
        with:
          name: rpgmod
          path: build-mod/build/libs/*.jar
